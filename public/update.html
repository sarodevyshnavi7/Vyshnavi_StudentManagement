<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
            <h1>Student Management</h1>
            <p>School Records Management Portal</p>
        </div>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">⌂ Home</a>
    <a href="list.html">☷ List Students</a>
    <a href="listOne.html">⌕ Search Student</a>
    <a href="insert.html">＋ Insert Student</a>
    <a href="update.html" class="active">✎ Update Student</a>
    <a href="delete.html">▤ Delete Student</a>
</nav>

<main class="container">

    <div class="page-heading">
        <h2>✏️ Update Student</h2>
        <p>Select a student and modify the details.</p>
    </div>

    <img src="images/update.jpg"
         alt="Update Student"
         class="page-image">

    <section class="panel">
        <form id="updateForm">

            <div class="form-group">
                <label for="sno">Select Student</label>
                <select id="sno" required>
                    <option value="">-- Select Student --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="total">Total Marks</label>
                <input type="number" id="total" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Update Student
                </button>
                <button type="reset" class="btn btn-outline">
                    Clear Form
                </button>
            </div>

        </form>
    </section>

</main>

<footer class="site-footer">
    Student Management System | School Database Project
</footer>

<script>
loadStudents();

function loadStudents() {
    fetch("/student")
        .then(response => {
            if (!response.ok) throw new Error("Unable to load students");
            return response.json();
        })
        .then(data => {
            const dropdown = document.getElementById("sno");

            data.forEach(student => {
                const option = document.createElement("option");
                option.value = student.sno;
                option.textContent = student.sno + " - " + student.name;
                dropdown.appendChild(option);
            });
        })
        .catch(error => alert(error.message));
}

document.getElementById("sno").addEventListener("change", function() {
    const sno = this.value;

    if (!sno) {
        document.getElementById("name").value = "";
        document.getElementById("total").value = "";
        return;
    }

    fetch("/student/" + encodeURIComponent(sno))
        .then(response => {
            if (!response.ok) throw new Error("Unable to get student details");
            return response.json();
        })
        .then(data => {
            if (!data || data.length === 0) {
                alert("Student Not Found");
                return;
            }

            document.getElementById("name").value = data[0].name;
            document.getElementById("total").value = data[0].total;
        })
        .catch(error => alert(error.message));
});

document.getElementById("updateForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const sno = document.getElementById("sno").value;
    const name = document.getElementById("name").value.trim();
    const total = document.getElementById("total").value;

    if (!sno) {
        alert("Please select a student");
        return;
    }

    fetch("/student/" + encodeURIComponent(sno), {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            total: total
        })
    })
    .then(response => response.text().then(message => {
        if (!response.ok) throw new Error(message);
        return message;
    }))
    .then(message => {
        alert(message);
        location.href = "list.html";
    })
    .catch(error => alert(error.message));
});
</script>

</body>
</html>
