<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
            <h1>Student Management</h1>
            <p>School Records Management Portal</p>
        </div>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">⌂ Home</a>
    <a href="list.html">☷ List Students</a>
    <a href="listOne.html">⌕ Search Student</a>
    <a href="insert.html" class="active">＋ Insert Student</a>
    <a href="update.html">✎ Update Student</a>
    <a href="delete.html">▤ Delete Student</a>
</nav>

<main class="container">

    <div class="page-heading">
        <h2>➕ Insert Student</h2>
        <p>Enter information to create a new student record.</p>
    </div>

    <img src="images/insert.jpg"
         alt="Insert Student Form"
         class="page-image">

    <section class="panel">
        <form id="insertForm">

            <div class="form-group">
                <label for="sno">Student Number</label>
                <input type="number" id="sno"
                       placeholder="Enter student number" required>
            </div>

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label for="total">Total Marks</label>
                <input type="number" id="total"
                       placeholder="Enter total marks" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Save Student
                </button>
                <button type="reset" class="btn btn-outline">
                    Clear Form
                </button>
            </div>

        </form>
    </section>

</main>

<footer class="site-footer">
    Student Management System | School Database Project
</footer>

<script>
document.getElementById("insertForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const sno = document.getElementById("sno").value;
    const name = document.getElementById("name").value.trim();
    const total = document.getElementById("total").value;

    fetch("/student", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            sno: sno,
            name: name,
            total: total
        })
    })
    .then(response => response.text().then(message => {
        if (!response.ok) throw new Error(message);
        return message;
    }))
    .then(message => {
        alert(message);
        location.href = "list.html";
    })
    .catch(error => alert(error.message));
});
</script>

</body>
</html>
